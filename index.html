<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MyshPPT – Make a presentation in minutes</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="top">
    <h1>MyshPPT</h1>
    <p>Type your topic. Get a ready, editable PowerPoint.</p>
  </header>

  <main>
    <section class="panel" aria-label="Presentation settings">
      <label for="topic">What is your presentation about?</label>
      <textarea id="topic" rows="4" placeholder="Example: Causes and effects of climate change"></textarea>

      <div class="row">
        <div><label for="slides">Slides</label>
          <input id="slides" type="number" min="4" max="20" value="8"></div>
        <div><label for="language">Language</label>
          <select id="language"><option>English</option><option>Hindi</option><option>Marathi</option><option>Gujarati</option></select></div>
      </div>

      <label for="audience">Who will watch it?</label>
      <select id="audience">
        <option>College students</option><option>School students</option>
        <option>Teachers and examiners</option><option>Business people</option>
      </select>

      <label for="tone">Style of writing</label>
      <select id="tone"><option>Professional</option><option>Simple and easy</option><option>Friendly</option></select>

      <label>Theme</label>
      <div id="themes" class="themes"></div>
      <input type="hidden" id="theme" value="ocean">

      <button id="generate" class="primary">Create my slides</button>
      <p id="status" role="status"></p>
    </section>

    <section class="result" aria-label="Your slides">
      <div id="empty" class="empty">
        <h2>Your slides will appear here</h2>
        <p>You can edit every title and point before you download.</p>
      </div>
      <div id="toolbar" class="toolbar" hidden>
        <span id="count"></span>
        <button id="download" class="primary">Download .pptx</button>
      </div>
      <div id="slideList"></div>
    </section>
  </main>

  <script>window.THEMES = {{ themes|tojson }};</script>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
